<svg xmlns="http://www.w3.org/2000/svg" width="768" height="230" viewBox="0 0 768 230" role="img" aria-labelledby="title">
  <title id="title">How an image gets into a post: save it in assets/images, reference it from a post in _posts, then publish</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .step { font-size: 17px; font-weight: 600; fill: #24292f; }
    .note { font-size: 14px; fill: #57606a; }
    .code { font-size: 13px; font-weight: 600; fill: #0969da; }
    .line { fill: #d0d7de; }
  </style>
  <defs>
    <symbol id="picture" viewBox="0 0 60 44">
      <rect width="60" height="44" fill="#fde2b8"/>
      <circle cx="44" cy="13" r="6" fill="#ff9f43"/>
      <path d="M0 44 L16 22 L26 32 L37 18 L60 44 Z" fill="#6e5494"/>
      <path d="M0 44 L10 34 L18 40 L28 30 L42 44 Z" fill="#3e2c5c"/>
    </symbol>
  </defs>

  <rect x="0.5" y="0.5" width="767" height="229" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- 1. A folder holding the image file -->
  <g transform="translate(128 0)">
    <path d="M-54 42 H-22 L-14 50 H54 Q60 50 60 56 V128 Q60 134 54 134 H-54 Q-60 134 -60 128 V48 Q-60 42 -54 42 Z" fill="#218bff"/>
    <rect x="-38" y="30" width="72" height="58" rx="4" fill="#fff" stroke="#d0d7de"/>
    <use href="#picture" x="-32" y="36" width="60" height="44"/>
    <path d="M-60 74 H60 V128 Q60 134 54 134 H-54 Q-60 134 -60 128 Z" fill="#54aeff"/>
    <text class="step" y="172">1. Save the image</text>
    <text class="note mono" y="198">assets/images/</text>
  </g>

  <!-- 2. A Markdown post that references the image -->
  <g transform="translate(384 0)">
    <path d="M-41 30 H31 L47 46 V128 Q47 134 41 134 H-41 Q-47 134 -47 128 V36 Q-47 30 -41 30 Z" fill="#fff" stroke="#d0d7de"/>
    <path d="M31 30 V40 Q31 46 37 46 H47" fill="#eaeef2" stroke="#d0d7de"/>
    <rect class="line" x="-35" y="54" width="56" height="6" rx="3"/>
    <rect class="line" x="-35" y="66" width="70" height="6" rx="3"/>
    <rect x="-39" y="80" width="78" height="22" rx="4" fill="#ddf4ff"/>
    <text class="code mono" y="96">![…](…)</text>
    <rect class="line" x="-35" y="110" width="64" height="6" rx="3"/>
    <rect class="line" x="-35" y="122" width="44" height="6" rx="3"/>
    <text class="step" y="172">2. Reference it</text>
    <text class="note mono" y="198">_posts/*.md</text>
  </g>

  <!-- 3. The published page showing the image -->
  <g transform="translate(640 0)">
    <rect x="-60" y="32" width="120" height="102" rx="8" fill="#fff" stroke="#d0d7de"/>
    <path d="M-52 32.5 H52 Q59.5 32.5 59.5 40 V50 H-59.5 V40 Q-59.5 32.5 -52 32.5 Z" fill="#eaeef2"/>
    <line x1="-59.5" y1="50" x2="59.5" y2="50" stroke="#d0d7de"/>
    <circle cx="-49" cy="41" r="3" fill="#ff5f57"/>
    <circle cx="-39" cy="41" r="3" fill="#febc2e"/>
    <circle cx="-29" cy="41" r="3" fill="#28c840"/>
    <use href="#picture" x="-48" y="58" width="96" height="44" preserveAspectRatio="none"/>
    <rect class="line" x="-48" y="110" width="80" height="6" rx="3"/>
    <rect class="line" x="-48" y="121" width="56" height="6" rx="3"/>
    <text class="step" y="172">3. Publish</text>
    <text class="note" y="198">It shows in the post</text>
  </g>

  <!-- Arrows between the steps -->
  <g fill="none" stroke="#57606a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 84 H300 M290 75 L301 84 L290 93"/>
    <path d="M468 84 H544 M534 75 L545 84 L534 93"/>
  </g>
</svg>
